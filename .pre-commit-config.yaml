# Mirrors the CI lint/rust jobs (.github/workflows/ci.yml).
# Uses local hooks via `uv run` / `cargo` so versions match the pinned toolchain.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Path-based (not per-file) so ruff's extend-exclude / per-file-ignores in
      # pyproject.toml apply — the upstream test suite must stay untouched.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix python/ tests/ benchmarks/
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format python/ tests/ benchmarks/
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: ty
        name: ty check
        entry: uv run ty check python/dateutil/ tests/
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      - id: cargo-clippy
        name: cargo clippy (workspace)
        entry: cargo clippy --workspace --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        require_serial: true
